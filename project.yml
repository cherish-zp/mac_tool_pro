name: mac_tool_pro
options:
  bundleIdPrefix: com.zp.mac-tool-pro
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  mac_tool_pro:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Resources/App-Info.plist
    entitlements:
      path: Resources/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.mac-tool-pro
        PRODUCT_NAME: mac_tool_pro
    dependencies:
      - target: FinderSyncExt
        embed: true
  FinderSyncExt:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FinderSyncExt
      - path: Sources/Shared
    info:
      path: Resources/Ext-Info.plist
    entitlements:
      path: Resources/Ext.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.mac-tool-pro.FinderSyncExt
        PRODUCT_NAME: FinderSyncExt
